name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # L'ordine non e' casuale: i controlli che falliscono in due secondi
      # vengono prima di quelli che ne impiegano trenta.
      - name: Confini architetturali e stile
        run: npm run lint

      - name: Integrita di /data
        run: npm run validate:data

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Budget di dimensione
        run: npm run size-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Le pull request eseguono tutti i controlli ma non pubblicano nulla.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
